apiVersion: 1
datasources:
  - name: BuildLens Postgres
    uid: buildlens-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: buildlens_grafana
    isDefault: true
    editable: false
    version: 1
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1800
      maxOpenConns: 3
      maxIdleConns: 1
      connMaxLifetime: 300
      timescaledb: false
