# golangci-lint v2 configuration (pinned binary: v2.14.0, see notes in docs/study/P1-design.md).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose      # HTTP response bodies are closed
    - contextcheck   # context is passed down, not replaced by context.Background()
    - errorlint      # errors compared with errors.Is/As, wrapped with %w
    - gosec          # common security mistakes
    - misspell
    - nilerr         # returning nil when err != nil
    - noctx          # outbound HTTP and SQL calls carry a context
    - rowserrcheck   # rows.Err() is checked
    - sqlclosecheck  # rows and statements are closed
    - unconvert
    - usestdlibvars  # http.MethodGet instead of "GET", etc.
  settings:
    govet:
      enable:
        - shadow
      settings:
        shadow:
          strict: false
  exclusions:
    # sqlc output carries the "Code generated ... DO NOT EDIT." header and is skipped.
    generated: lax
    rules:
      # err shadowing inside `if err := ...; err != nil` is idiomatic Go.
      - linters: [govet]
        text: 'shadow: declaration of "err" shadows declaration'
      # Tests use fixed credentials for throwaway containers, plain test servers and local URLs.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nibinrj/buildlens
